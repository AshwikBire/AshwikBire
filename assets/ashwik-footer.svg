<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="Footer: Ashwik Bire, Pune, India" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    @media (prefers-reduced-motion: reduce) { .abf-motion { display: none; } }
  </style>
  <defs>
    <linearGradient id="abf-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.5" stop-color="#190B12"/>
      <stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <linearGradient id="abf-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <filter id="abf-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="1200" height="110" fill="url(#abf-bg)"/>
  <rect x="100" y="38" width="1000" height="2" fill="url(#abf-line)"/>
  <circle class="abf-motion" cx="100" cy="39" r="5" fill="#E5B5C7" filter="url(#abf-blur)">
    <animate attributeName="cx" values="100;1100;100" dur="10s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="76" text-anchor="middle" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="13" letter-spacing="4" fill="#C77B9B">ASHWIK BIRE  ·  PUNE, INDIA</text>
</svg>
