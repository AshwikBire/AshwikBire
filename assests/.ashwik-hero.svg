<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="ab-t ab-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ab-t">Ashwik Rajendra Bire</title>
  <desc id="ab-d">Data Science and Analytics Professional. Power BI, TIBCO Spotfire, TIBCO TDV, Agentic AI.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) { .ab-motion { display: none; } }
  </style>
  <defs>
    <linearGradient id="ab-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <radialGradient id="ab-glow" cx="0.8" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ab-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ab-path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.6" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <linearGradient id="ab-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E5B5C7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E5B5C7" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ab-fade" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0.2" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="ab-gridmask">
      <rect width="1200" height="380" fill="url(#ab-fade)"/>
    </mask>
    <pattern id="ab-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C77B9B" stroke-opacity="0.16" stroke-width="0.6"/>
    </pattern>
    <filter id="ab-blur" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="ab-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#ab-bg)"/>
  <rect width="1200" height="380" fill="url(#ab-glow)"/>
  <rect width="1200" height="380" fill="url(#ab-grid)" mask="url(#ab-gridmask)"/>

  <!-- Moving sheen -->
  <rect class="ab-motion" x="-400" y="0" width="400" height="380" fill="url(#ab-sheen)">
    <animate attributeName="x" values="-400;1200" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- Orbital geometry -->
  <g fill="none" stroke="#C77B9B" stroke-opacity="0.3" stroke-width="1">
    <ellipse cx="930" cy="190" rx="230" ry="88" transform="rotate(-20 930 190)"/>
    <circle cx="930" cy="190" r="140" stroke-dasharray="2 8"/>
    <circle cx="930" cy="190" r="60" stroke-opacity="0.2"/>
  </g>
  <circle cx="930" cy="190" r="4" fill="#E5B5C7"/>
  <g class="ab-motion">
    <g>
      <circle cx="1070" cy="190" r="5" fill="#E5B5C7" filter="url(#ab-soft)"/>
      <circle cx="1070" cy="190" r="2.5" fill="#F8F0F3"/>
      <animateTransform attributeName="transform" type="rotate" from="0 930 190" to="360 930 190" dur="24s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="930" cy="102" r="3" fill="#C77B9B"/>
      <animateTransform attributeName="transform" type="rotate" from="360 930 190" to="0 930 190" dur="16s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Data path: static base + traveling highlight -->
  <path d="M60 322 C260 250 420 350 620 292 S960 215 1140 262" fill="none" stroke="url(#ab-path)" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round"/>
  <path class="ab-motion" d="M60 322 C260 250 420 350 620 292 S960 215 1140 262" pathLength="1" fill="none" stroke="#E5B5C7" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.1 0.9" filter="url(#ab-soft)">
    <animate attributeName="stroke-dashoffset" values="0.1;-0.9" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Eyebrow -->
  <text x="60" y="78" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="13" letter-spacing="5" fill="#C77B9B">PUNE · INDIA</text>
  <line x1="60" y1="92" x2="120" y2="92" stroke="#701A3D" stroke-width="1.5"/>

  <!-- Name -->
  <text x="60" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700" fill="#F8F0F3">Ashwik Rajendra Bire</text>

  <!-- Glowing underline -->
  <rect x="60" y="192" width="560" height="4" rx="2" fill="url(#ab-line)" filter="url(#ab-blur)" opacity="0.8">
    <animate class="ab-motion" attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="60" y="192" width="560" height="3" rx="1.5" fill="url(#ab-line)"/>

  <!-- Role -->
  <text x="60" y="244" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="19" letter-spacing="3" fill="#E5B5C7">DATA SCIENCE &amp; ANALYTICS PROFESSIONAL</text>
  <text x="60" y="280" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="15" letter-spacing="1.5" fill="#C77B9B">Power BI  •  TIBCO Spotfire  •  TIBCO TDV  •  Agentic AI</text>
</svg>
